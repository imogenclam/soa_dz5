name: soa-dz5

x-kafka-env: &kafka-env
  CLUSTER_ID: lzC2IdRrRQeaU79WvH0NAQ
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms128m -Xmx320m

x-kafka: &kafka
  image: apache/kafka:3.9.1
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
    interval: 10s
    timeout: 4s
    retries: 15
    start_period: 25s

x-app: &app
  image: ${COMPOSE_PROJECT_NAME}-python:local
  pull_policy: never

x-api-health: &api-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4).close()"]
  interval: 15s
  timeout: 6s
  retries: 6
  start_period: 20s

x-storage-env: &storage-env
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: cinema
  CLICKHOUSE_PASSWORD: cinema_local
  POSTGRES_DSN: postgresql://cinema:cinema_local@postgres:5432/cinema
  S3_ENDPOINT: http://s3:8333
  S3_ACCESS_KEY: cinema_admin
  S3_SECRET_KEY: cinema_storage_local
  S3_BUCKET: movie-analytics

services:
  kafka1:
    <<: *kafka
    hostname: kafka1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092
    volumes: [kafka1-data:/var/lib/kafka/data]

  kafka2:
    <<: *kafka
    hostname: kafka2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092
    volumes: [kafka2-data:/var/lib/kafka/data]

  kafka3:
    <<: *kafka
    hostname: kafka3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092
    volumes: [kafka3-data:/var/lib/kafka/data]

  schema-registry:
    image: ghcr.io/aiven-open/karapace:6.2.4
    entrypoint: ["python3", "-m", "karapace"]
    environment:
      KARAPACE_KARAPACE_REGISTRY: "true"
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8081
      KARAPACE_ADVERTISED_HOSTNAME: schema-registry
      KARAPACE_BOOTSTRAP_URI: kafka1:9092,kafka2:9092,kafka3:9092
      KARAPACE_REPLICATION_FACTOR: 3
      KARAPACE_TOPIC_NAME: _schemas
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  bootstrap:
    <<: *app
    build: .
    command: ["python", "-m", "producer.bootstrap"]
    depends_on:
      schema-registry: {condition: service_healthy}

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema_local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./db/clickhouse-config.xml:/etc/clickhouse-server/config.d/cinema.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "cinema", "--password", "cinema_local", "--query", "SELECT 1"]
      interval: 12s
      timeout: 5s
      retries: 10
      start_period: 20s

  ch-migrate:
    image: clickhouse/clickhouse-server:25.8-alpine
    entrypoint: ["clickhouse-client", "--host", "clickhouse", "--user", "cinema", "--password", "cinema_local", "--multiquery", "--queries-file", "/sql/events.sql", "/sql/analytics.sql", "/sql/dashboard-user.sql"]
    volumes: [./db:/sql:ro]
    depends_on:
      clickhouse: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_local
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 10s
      timeout: 3s
      retries: 10

  pg-migrate:
    image: postgres:17-alpine
    entrypoint: ["psql", "-h", "postgres", "-U", "cinema", "-d", "cinema", "-v", "ON_ERROR_STOP=1", "--single-transaction", "-f", "/sql/postgres.sql"]
    environment: {PGPASSWORD: cinema_local}
    volumes: [./db:/sql:ro]
    depends_on:
      postgres: {condition: service_healthy}

  producer:
    <<: *app
    command: ["uvicorn", "producer.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:${PRODUCER_PORT:-8000}:8000"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck: *api-health

  seed:
    <<: *app
    command: ["python", "-m", "producer.generate"]
    depends_on:
      ch-migrate: {condition: service_completed_successfully}

  s3:
    image: chrislusf/seaweedfs:4.17
    command: ["mini", "-dir=/data", "-admin.ui=false", "-webdav=false"]
    environment:
      AWS_ACCESS_KEY_ID: cinema_admin
      AWS_SECRET_ACCESS_KEY: cinema_storage_local
    volumes: [s3-data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s

  analytics:
    <<: *app
    command: ["uvicorn", "analytics.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *storage-env
      AGGREGATION_INTERVAL_SECONDS: ${AGGREGATION_INTERVAL_SECONDS:-60}
    ports: ["127.0.0.1:${ANALYTICS_PORT:-8001}:8000"]
    depends_on:
      ch-migrate: {condition: service_completed_successfully}
      pg-migrate: {condition: service_completed_successfully}
    healthcheck: *api-health

  grafana:
    build: ./grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cinema_dashboard_local
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes: [grafana-data:/var/lib/grafana]
    depends_on:
      ch-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  tests:
    <<: *app
    profiles: [test]
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    environment: *storage-env
    depends_on:
      producer: {condition: service_healthy}
      analytics: {condition: service_healthy}
      grafana: {condition: service_healthy}
      s3: {condition: service_healthy}

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  clickhouse-data:
  postgres-data:
  s3-data:
  grafana-data:
